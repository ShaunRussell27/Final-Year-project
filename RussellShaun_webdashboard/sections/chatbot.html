<div class="chatbot-section">
    <h2>Wellness Chatbot Assistant</h2>
    <p class="help-text">The chatbot uses your latest synced data from your Garmin device to personalise advice.</p>
    <div class="chatbot-config">
        <div class="form-group">
            <label for="chatUserId">User ID:</label>
            <input type="text" id="chatUserId" value="shaun" />
        </div>
        <input type="hidden" id="chatBackendUrl" value="https://final-year-project-production-1acf.up.railway.app" />
    </div>
    <p class="disclaimer-text">This chatbot is not a substitute for registered medical advice. Please consult a healthcare professional for medical concerns.</p>
    <div id="chatHistory" class="chat-history"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ask me anything about burnout, sleep, stress..." />
        <button id="chatSendBtn" class="btn-send">Send</button>
    </div>
</div>
