<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Chatbot - AI Burnout Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Wellness Chatbot</h1>
            <p>Chat with our AI assistant for wellness advice</p>
        </div>

        <div class="main-content">
            <div class="chatbot-section">
                <h2>Wellness Chatbot Assistant</h2>
                <div id="chatHistory" class="chat-history"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask me anything about burnout, sleep, stress..." />
                    <button id="chatSendBtn" class="btn-send">Send</button>
                </div>
            </div>

            <div class="back-link">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
